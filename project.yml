name: GymTrak
options:
  bundleIdPrefix: dev.ivanshishkin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  GymTrak:
    type: application
    platform: iOS
    sources:
      - path: GymTrak
        excludes: [GymTrak.entitlements]
      - path: Shared
    dependencies:
      - target: GymTrakWidgets
      - target: GymTrakWatch
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: GymTrak/Info.plist
      properties:
        CFBundleDisplayName: GymTrak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.ivanshishkin.gymtrak
            CFBundleURLSchemes: [gymtrak]
        NSHealthShareUsageDescription: GymTrak reads your runs, heart rate, steps, calories and sleep.
        NSHealthUpdateUsageDescription: GymTrak saves your lifts to Apple Health.
        HealthEnabled: $(HEALTH_ENABLED)
        StravaClientID: $(STRAVA_CLIENT_ID)
        StravaClientSecret: $(STRAVA_CLIENT_SECRET)
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ivanshishkin.gymtrak
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GymTrakWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [GymTrakWidgets.entitlements]
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: GymTrak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ivanshishkin.gymtrak.widgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widgets/GymTrakWidgets.entitlements
        DEVELOPMENT_TEAM: WSGA5S62WA
        SKIP_INSTALL: YES
  GymTrakWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch
        excludes: [GymTrakWatch.entitlements]
      - path: Shared
    dependencies:
      - target: GymTrakWatchWidgets
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: GymTrak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.ivanshishkin.gymtrak
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: GymTrak reads your heart rate during workouts.
        NSHealthUpdateUsageDescription: GymTrak saves your lifts to Apple Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ivanshishkin.gymtrak.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Watch/GymTrakWatch.entitlements
        DEVELOPMENT_TEAM: WSGA5S62WA
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
  GymTrakWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: WatchWidgets
        excludes: [GymTrakWatchWidgets.entitlements]
      - path: Shared
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: GymTrak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ivanshishkin.gymtrak.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/GymTrakWatchWidgets.entitlements
        DEVELOPMENT_TEAM: WSGA5S62WA
        SKIP_INSTALL: YES
  GymTrakTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GymTrakTests]
    dependencies:
      - target: GymTrak
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.ivanshishkin.gymtrak.tests
schemes:
  GymTrak:
    build:
      targets:
        GymTrak: all
        GymTrakTests: [test]
    test:
      targets: [GymTrakTests]
