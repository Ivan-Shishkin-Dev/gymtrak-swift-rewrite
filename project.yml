name: GymTrak
options:
  bundleIdPrefix: dev.ivanshishkin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GymTrak:
    type: application
    platform: iOS
    sources: [GymTrak]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ivanshishkin.gymtrak
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: GymTrak
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GymTrakTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GymTrakTests]
    dependencies:
      - target: GymTrak
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.ivanshishkin.gymtrak.tests
schemes:
  GymTrak:
    build:
      targets:
        GymTrak: all
        GymTrakTests: [test]
    test:
      targets: [GymTrakTests]
